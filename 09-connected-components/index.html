<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09. 连通域分析 - Connected Component Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4facfe;
            font-size: 2em;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        label {
            color: #aaa;
            font-size: 0.9em;
            min-width: 80px;
        }
        
        input[type="range"] {
            width: 120px;
            accent-color: #4facfe;
        }
        
        .value-display {
            background: rgba(79, 172, 254, 0.2);
            padding: 3px 8px;
            border-radius: 5px;
            font-family: monospace;
            min-width: 50px;
            text-align: center;
            color: #4facfe;
        }
        
        select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .image-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .image-card h3 {
            color: #4facfe;
            margin-bottom: 10px;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .image-card canvas {
            width: 100%;
            border-radius: 8px;
            background: #2a2a3e;
            image-rendering: pixelated;
        }
        
        .regions-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .regions-panel h2 {
            color: #4facfe;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .regions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .region-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .region-card:hover {
            background: rgba(79, 172, 254, 0.2);
        }
        
        .region-card.selected {
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.3);
        }
        
        .region-card canvas {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            background: #1a1a2e;
            image-rendering: pixelated;
            margin-bottom: 5px;
        }
        
        .region-card .label {
            font-size: 0.8em;
            color: #aaa;
        }
        
        .region-card .area {
            font-size: 0.75em;
            color: #666;
        }
        
        .info-panel {
            background: rgba(79, 172, 254, 0.1);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(79, 172, 254, 0.3);
        }
        
        .info-panel h3 {
            color: #4facfe;
            margin-bottom: 15px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
        }
        
        .info-item .label {
            color: #888;
            font-size: 0.85em;
        }
        
        .info-item .value {
            color: #4facfe;
            font-size: 1.2em;
            font-weight: 600;
        }
        
        .connectivity-toggle {
            display: flex;
            gap: 10px;
        }
        
        .connectivity-toggle button {
            flex: 1;
            padding: 8px 16px;
        }
        
        .connectivity-toggle button.active {
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.6);
        }
        
        .connectivity-toggle button:not(.active) {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
        }
        
        #fileInput {
            display: none;
        }
        
        .selected-region-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(240, 147, 251, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(240, 147, 251, 0.3);
        }
        
        .selected-region-info h4 {
            color: #f093fb;
            margin-bottom: 10px;
        }
        
        .property-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .property-row:last-child {
            border-bottom: none;
        }
        
        .property-name {
            color: #aaa;
        }
        
        .property-value {
            color: #4facfe;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 09. 连通域分析 (Connected Component Analysis)</h1>
        <p class="subtitle">将相连像素归为同一区域 - OCR 字符分割的核心技术</p>
        
        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="control-row">
                <input type="file" id="fileInput" accept="image/*">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📷 上传图片</button>
                <button onclick="loadSampleImage()">🎨 使用示例图</button>
                <button onclick="generateTextImage()">📝 生成文字图</button>
                <button onclick="generateShapesImage()">⬛ 生成形状图</button>
            </div>
            
            <div class="control-row">
                <span style="color: #4facfe; font-weight: 600;">连通性：</span>
                <div class="connectivity-toggle">
                    <button id="conn4Btn" onclick="setConnectivity(4)">4 连通</button>
                    <button id="conn8Btn" class="active" onclick="setConnectivity(8)">8 连通 ⭐</button>
                </div>
                
                <div class="control-group">
                    <label>二值化阈值:</label>
                    <input type="range" id="threshold" min="0" max="255" value="128">
                    <span class="value-display" id="thresholdValue">128</span>
                </div>
            </div>
            
            <div class="control-row">
                <span style="color: #f093fb; font-weight: 600;">区域过滤：</span>
                <div class="control-group">
                    <label>最小面积:</label>
                    <input type="range" id="minArea" min="1" max="500" value="10">
                    <span class="value-display" id="minAreaValue">10</span>
                </div>
                <div class="control-group">
                    <label>最大面积:</label>
                    <input type="range" id="maxArea" min="100" max="50000" value="10000">
                    <span class="value-display" id="maxAreaValue">10000</span>
                </div>
            </div>
        </div>
        
        <!-- 主要结果显示 -->
        <div class="image-grid">
            <div class="image-card">
                <h3>📷 原始图像</h3>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="image-card">
                <h3>⚫ 二值图像</h3>
                <canvas id="binaryCanvas"></canvas>
            </div>
            <div class="image-card">
                <h3>🎨 连通域标记</h3>
                <canvas id="labelCanvas"></canvas>
            </div>
        </div>
        
        <!-- 区域列表 -->
        <div class="regions-panel">
            <h2>📦 检测到的区域（点击查看详情）</h2>
            <div class="regions-grid" id="regionsGrid"></div>
            
            <div class="selected-region-info" id="selectedRegionInfo" style="display: none;">
                <h4>📊 区域详细信息</h4>
                <div id="regionProperties"></div>
            </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="info-panel">
            <h3>📊 分析结果统计</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="label">图像尺寸</div>
                    <div class="value" id="imageSizeInfo">-</div>
                </div>
                <div class="info-item">
                    <div class="label">连通性</div>
                    <div class="value" id="connectivityInfo">8 连通</div>
                </div>
                <div class="info-item">
                    <div class="label">检测区域数</div>
                    <div class="value" id="regionCountInfo">-</div>
                </div>
                <div class="info-item">
                    <div class="label">过滤后区域</div>
                    <div class="value" id="filteredCountInfo">-</div>
                </div>
                <div class="info-item">
                    <div class="label">处理时间</div>
                    <div class="value" id="processTimeInfo">-</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== 全局变量 ====================
        let currentImageData = null;
        let binaryImageData = null;
        let currentConnectivity = 8;
        let allRegions = [];
        let labelResult = null;
        
        // ==================== 工具函数 ====================
        
        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }
        
        function getPixel(imageData, x, y) {
            if (x < 0 || x >= imageData.width || y < 0 || y >= imageData.height) {
                return { r: 255, g: 255, b: 255, a: 255 };
            }
            const index = (y * imageData.width + x) * 4;
            return {
                r: imageData.data[index],
                g: imageData.data[index + 1],
                b: imageData.data[index + 2],
                a: imageData.data[index + 3]
            };
        }
        
        function setPixel(imageData, x, y, r, g, b, a = 255) {
            if (x < 0 || x >= imageData.width || y < 0 || y >= imageData.height) return;
            const index = (y * imageData.width + x) * 4;
            imageData.data[index] = r;
            imageData.data[index + 1] = g;
            imageData.data[index + 2] = b;
            imageData.data[index + 3] = a;
        }
        
        // ==================== 并查集 ====================
        
        class UnionFind {
            constructor(size) {
                this.parent = Array.from({ length: size }, (_, i) => i);
                this.rank = new Array(size).fill(0);
            }
            
            find(x) {
                if (this.parent[x] !== x) {
                    this.parent[x] = this.find(this.parent[x]);
                }
                return this.parent[x];
            }
            
            union(x, y) {
                const rootX = this.find(x);
                const rootY = this.find(y);
                if (rootX !== rootY) {
                    if (this.rank[rootX] < this.rank[rootY]) {
                        this.parent[rootX] = rootY;
                    } else if (this.rank[rootX] > this.rank[rootY]) {
                        this.parent[rootY] = rootX;
                    } else {
                        this.parent[rootY] = rootX;
                        this.rank[rootX]++;
                    }
                }
            }
        }
        
        // ==================== 连通域标记 ====================
        
        function labelConnectedComponents(imageData, connectivity = 8, threshold = 128) {
            const { width, height } = imageData;
            const labels = new Int32Array(width * height);
            const maxLabels = width * height;
            const uf = new UnionFind(maxLabels);
            let nextLabel = 1;
            
            // Pass 1
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    const pixel = getPixel(imageData, x, y);
                    
                    if (pixel.r >= threshold) {
                        labels[idx] = 0;
                        continue;
                    }
                    
                    const neighborLabels = [];
                    
                    if (x > 0 && labels[idx - 1] > 0) neighborLabels.push(labels[idx - 1]);
                    if (y > 0 && labels[idx - width] > 0) neighborLabels.push(labels[idx - width]);
                    
                    if (connectivity === 8) {
                        if (x > 0 && y > 0 && labels[idx - width - 1] > 0) neighborLabels.push(labels[idx - width - 1]);
                        if (x < width - 1 && y > 0 && labels[idx - width + 1] > 0) neighborLabels.push(labels[idx - width + 1]);
                    }
                    
                    if (neighborLabels.length === 0) {
                        labels[idx] = nextLabel++;
                    } else {
                        const minLabel = Math.min(...neighborLabels);
                        labels[idx] = minLabel;
                        for (const label of neighborLabels) {
                            if (label !== minLabel) uf.union(minLabel, label);
                        }
                    }
                }
            }
            
            // Pass 2
            const labelMap = new Map();
            let finalLabelCount = 0;
            
            for (let i = 0; i < labels.length; i++) {
                if (labels[i] > 0) {
                    const root = uf.find(labels[i]);
                    if (!labelMap.has(root)) {
                        labelMap.set(root, ++finalLabelCount);
                    }
                    labels[i] = labelMap.get(root);
                }
            }
            
            return { labels, numLabels: finalLabelCount, width, height };
        }
        
        // ==================== 区域属性提取 ====================
        
        function extractRegionProperties(labels, numLabels, width, height) {
            const regions = [];
            for (let i = 0; i <= numLabels; i++) {
                regions.push({
                    label: i, area: 0, pixels: [],
                    minX: Infinity, maxX: -Infinity,
                    minY: Infinity, maxY: -Infinity,
                    sumX: 0, sumY: 0
                });
            }
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const label = labels[y * width + x];
                    if (label > 0) {
                        const r = regions[label];
                        r.area++;
                        r.pixels.push({ x, y });
                        r.minX = Math.min(r.minX, x);
                        r.maxX = Math.max(r.maxX, x);
                        r.minY = Math.min(r.minY, y);
                        r.maxY = Math.max(r.maxY, y);
                        r.sumX += x;
                        r.sumY += y;
                    }
                }
            }
            
            return regions.slice(1).filter(r => r.area > 0).map(r => ({
                label: r.label,
                area: r.area,
                boundingBox: {
                    x: r.minX, y: r.minY,
                    width: r.maxX - r.minX + 1,
                    height: r.maxY - r.minY + 1
                },
                centroid: { x: r.sumX / r.area, y: r.sumY / r.area },
                fillRatio: r.area / ((r.maxX - r.minX + 1) * (r.maxY - r.minY + 1)),
                aspectRatio: (r.maxX - r.minX + 1) / (r.maxY - r.minY + 1),
                pixels: r.pixels
            }));
        }
        
        // ==================== 可视化 ====================
        
        function hsvToRgb(h, s, v) {
            let r, g, b;
            const i = Math.floor(h / 60) % 6;
            const f = h / 60 - Math.floor(h / 60);
            const p = v * (1 - s);
            const q = v * (1 - f * s);
            const t = v * (1 - (1 - f) * s);
            switch (i) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
        }
        
        function generateColors(n) {
            const colors = [];
            for (let i = 0; i < n; i++) {
                const hue = (i * 137.508) % 360;
                colors.push(hsvToRgb(hue, 0.7 + (i % 3) * 0.1, 0.8 + (i % 2) * 0.1));
            }
            return colors;
        }
        
        function colorizeLabels(labels, numLabels, width, height) {
            const result = new ImageData(width, height);
            const colors = generateColors(numLabels);
            
            for (let i = 0; i < result.data.length; i += 4) {
                result.data[i] = result.data[i + 1] = result.data[i + 2] = 255;
                result.data[i + 3] = 255;
            }
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const label = labels[y * width + x];
                    if (label > 0 && label <= numLabels) {
                        const c = colors[label - 1];
                        setPixel(result, x, y, c.r, c.g, c.b);
                    }
                }
            }
            
            return result;
        }
        
        function toBinary(imageData, threshold) {
            const result = new ImageData(imageData.width, imageData.height);
            for (let i = 0; i < imageData.data.length; i += 4) {
                const gray = 0.299 * imageData.data[i] + 0.587 * imageData.data[i + 1] + 0.114 * imageData.data[i + 2];
                const val = gray < threshold ? 0 : 255;
                result.data[i] = result.data[i + 1] = result.data[i + 2] = val;
                result.data[i + 3] = 255;
            }
            return result;
        }
        
        // ==================== UI 函数 ====================
        
        function displayImageOnCanvas(imageData, canvasId) {
            const canvas = document.getElementById(canvasId);
            canvas.width = imageData.width;
            canvas.height = imageData.height;
            canvas.getContext('2d').putImageData(imageData, 0, 0);
        }
        
        function updateSliderDisplays() {
            document.getElementById('thresholdValue').textContent = document.getElementById('threshold').value;
            document.getElementById('minAreaValue').textContent = document.getElementById('minArea').value;
            document.getElementById('maxAreaValue').textContent = document.getElementById('maxArea').value;
        }
        
        function setConnectivity(conn) {
            currentConnectivity = conn;
            document.getElementById('conn4Btn').classList.toggle('active', conn === 4);
            document.getElementById('conn8Btn').classList.toggle('active', conn === 8);
            document.getElementById('connectivityInfo').textContent = `${conn} 连通`;
            if (currentImageData) processImage();
        }
        
        function processImage() {
            if (!currentImageData) return;
            
            const threshold = parseInt(document.getElementById('threshold').value);
            const minArea = parseInt(document.getElementById('minArea').value);
            const maxArea = parseInt(document.getElementById('maxArea').value);
            
            const startTime = performance.now();
            
            // 二值化
            binaryImageData = toBinary(currentImageData, threshold);
            displayImageOnCanvas(binaryImageData, 'binaryCanvas');
            
            // 连通域标记
            labelResult = labelConnectedComponents(binaryImageData, currentConnectivity, 128);
            
            // 提取区域属性
            allRegions = extractRegionProperties(labelResult.labels, labelResult.numLabels, labelResult.width, labelResult.height);
            
            // 过滤区域
            const filteredRegions = allRegions.filter(r => r.area >= minArea && r.area <= maxArea);
            
            // 着色显示
            const colorized = colorizeLabels(labelResult.labels, labelResult.numLabels, labelResult.width, labelResult.height);
            displayImageOnCanvas(colorized, 'labelCanvas');
            
            const endTime = performance.now();
            
            // 更新统计信息
            document.getElementById('imageSizeInfo').textContent = `${labelResult.width} × ${labelResult.height}`;
            document.getElementById('regionCountInfo').textContent = allRegions.length;
            document.getElementById('filteredCountInfo').textContent = filteredRegions.length;
            document.getElementById('processTimeInfo').textContent = (endTime - startTime).toFixed(2) + 'ms';
            
            // 显示区域列表
            displayRegionsList(filteredRegions);
        }
        
        function displayRegionsList(regions) {
            const grid = document.getElementById('regionsGrid');
            grid.innerHTML = '';
            
            const colors = generateColors(labelResult.numLabels);
            
            regions.forEach((region, index) => {
                const card = document.createElement('div');
                card.className = 'region-card';
                card.onclick = () => selectRegion(region, colors[region.label - 1]);
                
                // 创建小型预览画布
                const canvas = document.createElement('canvas');
                const bbox = region.boundingBox;
                const size = Math.max(bbox.width, bbox.height);
                const scale = 60 / size;
                canvas.width = 60;
                canvas.height = 60;
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, 60, 60);
                
                const color = colors[region.label - 1];
                ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
                
                const offsetX = (60 - bbox.width * scale) / 2;
                const offsetY = (60 - bbox.height * scale) / 2;
                
                region.pixels.forEach(p => {
                    const px = (p.x - bbox.x) * scale + offsetX;
                    const py = (p.y - bbox.y) * scale + offsetY;
                    ctx.fillRect(px, py, Math.max(1, scale), Math.max(1, scale));
                });
                
                const labelSpan = document.createElement('div');
                labelSpan.className = 'label';
                labelSpan.textContent = `区域 ${region.label}`;
                
                const areaSpan = document.createElement('div');
                areaSpan.className = 'area';
                areaSpan.textContent = `${region.area} px`;
                
                card.appendChild(canvas);
                card.appendChild(labelSpan);
                card.appendChild(areaSpan);
                grid.appendChild(card);
            });
        }
        
        function selectRegion(region, color) {
            // 更新选中状态
            document.querySelectorAll('.region-card').forEach((card, i) => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // 显示详细信息
            const infoPanel = document.getElementById('selectedRegionInfo');
            infoPanel.style.display = 'block';
            
            const props = document.getElementById('regionProperties');
            props.innerHTML = `
                <div class="property-row">
                    <span class="property-name">标签</span>
                    <span class="property-value">${region.label}</span>
                </div>
                <div class="property-row">
                    <span class="property-name">面积</span>
                    <span class="property-value">${region.area} 像素</span>
                </div>
                <div class="property-row">
                    <span class="property-name">边界框</span>
                    <span class="property-value">(${region.boundingBox.x}, ${region.boundingBox.y}) ${region.boundingBox.width}×${region.boundingBox.height}</span>
                </div>
                <div class="property-row">
                    <span class="property-name">质心</span>
                    <span class="property-value">(${region.centroid.x.toFixed(1)}, ${region.centroid.y.toFixed(1)})</span>
                </div>
                <div class="property-row">
                    <span class="property-name">填充率</span>
                    <span class="property-value">${(region.fillRatio * 100).toFixed(1)}%</span>
                </div>
                <div class="property-row">
                    <span class="property-name">宽高比</span>
                    <span class="property-value">${region.aspectRatio.toFixed(2)}</span>
                </div>
            `;
            
            // 在标记图上高亮该区域
            highlightRegion(region);
        }
        
        function highlightRegion(region) {
            const canvas = document.getElementById('labelCanvas');
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // 绘制边界框
            const bbox = region.boundingBox;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(bbox.x - 2, bbox.y - 2, bbox.width + 4, bbox.height + 4);
        }
        
        function loadImage(imageData) {
            currentImageData = imageData;
            displayImageOnCanvas(currentImageData, 'originalCanvas');
            processImage();
        }
        
        function loadSampleImage() {
            const width = 200;
            const height = 150;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#000000';
            
            // 矩形
            ctx.fillRect(20, 20, 40, 30);
            
            // 圆形
            ctx.beginPath();
            ctx.arc(120, 40, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // 三角形
            ctx.beginPath();
            ctx.moveTo(170, 60);
            ctx.lineTo(150, 20);
            ctx.lineTo(190, 20);
            ctx.closePath();
            ctx.fill();
            
            // 小点（噪点）
            for (let i = 0; i < 10; i++) {
                ctx.fillRect(Math.random() * width, Math.random() * height, 2, 2);
            }
            
            // L 形
            ctx.fillRect(20, 90, 15, 40);
            ctx.fillRect(20, 115, 40, 15);
            
            // 十字
            ctx.fillRect(100, 85, 10, 50);
            ctx.fillRect(85, 105, 40, 10);
            
            // 中空矩形
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 5;
            ctx.strokeRect(150, 85, 35, 45);
            
            loadImage(ctx.getImageData(0, 0, width, height));
        }
        
        function generateTextImage() {
            const width = 300;
            const height = 80;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('OCR 123', width / 2, height / 2);
            
            loadImage(ctx.getImageData(0, 0, width, height));
        }
        
        function generateShapesImage() {
            const width = 250;
            const height = 200;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            ctx.fillStyle = '#000000';
            
            // 对角线连接的像素（测试连通性）
            for (let i = 0; i < 8; i++) {
                ctx.fillRect(20 + i * 10, 20 + i * 10, 8, 8);
            }
            
            // 多个小方块
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 5; col++) {
                    ctx.fillRect(130 + col * 22, 20 + row * 25, 15, 18);
                }
            }
            
            // 一个大区域
            ctx.fillRect(20, 120, 100, 60);
            
            // 带孔的区域
            ctx.fillRect(150, 120, 80, 60);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(170, 140, 40, 20);
            
            loadImage(ctx.getImageData(0, 0, width, height));
        }
        
        // ==================== 事件监听 ====================
        
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                loadImage(ctx.getImageData(0, 0, img.width, img.height));
            };
            img.src = URL.createObjectURL(file);
        });
        
        ['threshold', 'minArea', 'maxArea'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                updateSliderDisplays();
                processImage();
            });
        });
        
        // 初始化
        updateSliderDisplays();
        loadSampleImage();
    </script>
</body>
</html>
