<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{LESSON_TITLE}} · 交互练习</title>
  <link rel="stylesheet" href="../shared/lab.css">
</head>
<body>
  <main class="lab-shell">
    <header class="lab-header"><p class="eyebrow">动手理解</p><h1>{{LESSON_TITLE}}</h1><p>{{LESSON_EXPERIMENT_GOAL}}</p></header>
    <div class="lab-grid">
      <section class="panel" aria-labelledby="controls-title">
        <h2 id="controls-title">输入与操作</h2>
        {{LESSON_CONTROLS}}
        <button id="reset" type="button">恢复初始示例</button>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section class="panel" aria-labelledby="results-title">
        <h2 id="results-title">观察过程与结果</h2>
        {{LESSON_RESULTS}}
      </section>
    </div>
    <section class="panel"><h2>试一试，再解释</h2>{{LESSON_COMPARISON_TASK}}</section>
  </main>
  <script type="module" src="../shared/course-nav.js"></script>
  <script type="module" src="./browser.js"></script>
</body>
</html>
