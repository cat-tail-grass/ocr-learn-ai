schema: spec-driven

context: |
  本项目是 JavaScript OCR 原理学习项目，参考 OUTLINE.md、PROGRESS.md 和 .cursorrules。
  截至 2026-09-11，第01–26章三件套已完成生成及正确性复核；用户确认已掌握的仍为01–13章。
  当前活动任务 integrate-vuepress-course-site：使用VuePress整合完整讲义、章节导航、搜索和HTML实验入口，当前仅建立任务，尚未实施迁移。
  原课程任务按用户要求归档，保留51/56的实际状态；未完成的实拍验收保存在 openspec/backlog/real-photo-validation.md，归档不代表实拍通过。
  最终业务目标继续是使用项目自主训练的模型识别照片中的单行手写数字串，并如实报告实际评估结果。
  2026-09-22 开始面向资深前后端研发与技术主管分享，可以分多节课，听众具备机器学习基础。
  文档和注释使用中文，保留必要的英文术语；解释原理、公式、实现、适用条件及局限。
  VuePress任务必须采用子代理局部实施、主代理输送上下文并最终集成：A布局导航、B实验资源、C正文兼容与搜索、D独立验收。主代理先定接口和互斥写范围；只在实际验证后勾选任务。
  子代理默认使用有边界的新上下文，不继承完整历史；中断保留阶段结果和未完成状态，主代理重新分配剩余工作。学习顺序仍按章节，不将材料生成或测试通过等同于学习者已掌握。
  按 docs/COURSE_STANDARD.md 对齐旧课程三件套颗粒度：README 完整技术展开、HTML 可交互过程与对照、index.js 多步骤可运行教学实验。
  使用 JavaScript、Canvas 和可解释的自主算法，可使用 TensorFlow.js 训练自己的模型。
  最终 demo 不使用第三方成品 OCR 引擎或远程识别服务代替自己的实现。
  输入约定：白纸深色笔、单行横写、数字有基本间隔、完整拍摄；允许不同字迹、轻微倾斜和光照不均。
  现场照片由用户从群聊保存并手动导入 demo，不需要群聊自动化集成。

rules:
  proposal:
    - 区分完整课程学习范围与最终数字串 demo 的实现范围。
    - 区分新站点整合、既有课程成果和单独保留的实拍验收，不因旧任务归档声称所有场景已通过。
  specs:
    - 使用可验证场景，并区分模型置信度、独立测试准确率与字符错误率。
  tasks:
    - 按依赖顺序拆分可验证的小任务，保留逐章学习节奏。
    - 仅在相应工作真实完成后勾选任务；创建提案不代表课程或 demo 已完成。
    - 标明主代理和模块子代理的责任、接口依赖、写入边界、交付证据与独立验收；主代理负责最终集成与状态汇总。
